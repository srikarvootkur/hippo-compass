services:
  assistant-api:
    build:
      context: ../services/assistant-api
    env_file:
      - ../.env
    environment:
      LANGGRAPH_WORKFLOWS_URL: ${LANGGRAPH_WORKFLOWS_URL:-http://langgraph-workflows:8070}
      AGENTS_WORKFLOWS_URL: ${AGENTS_WORKFLOWS_URL:-http://agents-workflows:8090}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - redis
      - langgraph-workflows
      - agents-workflows
    restart: unless-stopped

  langgraph-workflows:
    build:
      context: ../services/langgraph-workflows
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8070:8070"
    depends_on:
      - agents-workflows
    restart: unless-stopped

  agents-workflows:
    build:
      context: ../services/agents-workflows
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

  workers:
    build:
      context: ../services/workers
    env_file:
      - ../.env
    environment:
      HIPPO_COMPASS_API_URL: ${HIPPO_COMPASS_API_URL:-http://assistant-api:8080}
      HIPPO_COMPASS_API_KEY: ${HIPPO_COMPASS_API_KEY:-change-me-local-dev}
    depends_on:
      - redis
      - assistant-api
    restart: unless-stopped

  # Owns the only writable Google Health credential mount.  Enable after the
  # one-time readonly OAuth login has completed (see docs/ghealth-ingestion.md).
  ghealth-ingest:
    build:
      context: ../services/ghealth-ingest
      args:
        GHEALTH_GIT_REF: ${GHEALTH_GIT_REF:-9cf02743d9ca051500b7c1c181eb88a9ae8988a5}
    env_file:
      - ../.env
    environment:
      GHEALTH_CONFIG_DIR: /run/ghealth
      GHEALTH_TIMEZONE: America/New_York
      TZ: America/New_York
      GHEALTH_BACKFILL_DAYS: ${GHEALTH_BACKFILL_DAYS:-90}
      GHEALTH_BACKFILL_WINDOW_DAYS: ${GHEALTH_BACKFILL_WINDOW_DAYS:-7}
      GHEALTH_OVERLAP_HOURS: ${GHEALTH_OVERLAP_HOURS:-24}
      GHEALTH_SYNC_INTERVAL_SECONDS: ${GHEALTH_SYNC_INTERVAL_SECONDS:-14400}
    volumes:
      - ${GHEALTH_CONFIG_HOST_PATH:?Set GHEALTH_CONFIG_HOST_PATH to a root-owned secret directory}:/run/ghealth:rw
    profiles:
      - ghealth
    restart: unless-stopped

  # Existing databases do not execute docker-entrypoint-initdb.d again.
  # Run explicitly after deployment: docker compose --profile migrations run --rm db-migrate
  db-migrate:
    image: postgres:16-alpine
    env_file:
      - ../.env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-assistant}
    volumes:
      - ../db/migrations:/migrations:ro
    command: ["sh", "-ec", "psql \"$${DATABASE_URL}\" -v ON_ERROR_STOP=1 -f /migrations/004_ghealth_ingestion.sql"]
    profiles:
      - migrations

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    profiles:
      - local-db
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - assistant-api
    profiles:
      - production
    restart: unless-stopped

  openclaw:
    image: ${OPENCLAW_RUNTIME_IMAGE:-hippo-openclaw:ghealth}
    build:
      context: ../services/openclaw-runtime
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
        GHEALTH_GIT_REF: ${GHEALTH_GIT_REF:-9cf02743d9ca051500b7c1c181eb88a9ae8988a5}
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - openclaw-data:/data
    profiles:
      - openclaw
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  caddy-data:
  caddy-config:
  openclaw-data:
